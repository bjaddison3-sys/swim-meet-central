<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17613d">
  <meta name="description" content="Swim Meet Central offline workstation test">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Swim Meet Central 2.0 — Offline Test</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b25;background:#f1f5f3}
    body{margin:0;padding:24px}main{max-width:640px;margin:32px auto;background:white;padding:30px;border-radius:18px;box-shadow:0 6px 24px #102b1b15}
    h1{color:#17613d;margin:0 0 8px}p{line-height:1.5}.muted{color:#586b63}.status{padding:12px 16px;border-radius:10px;background:#e7f4ea;margin:18px 0}
    label{display:block;font-weight:650;margin:18px 0 8px}textarea{box-sizing:border-box;width:100%;min-height:110px;padding:12px;border:1px solid #a6b8ae;border-radius:10px;font:inherit}
    button{background:#17613d;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:650;cursor:pointer;margin-top:12px}
    button:disabled{opacity:.6;cursor:wait}#saved{font-weight:600;color:#17613d;min-height:1.5em}
  </style>
</head>
<body>
  <main>
    <h1>Swim Meet Central 2.0</h1>
    <p class="muted">Announcer Workstation · Step 7 Offline Test</p>
    <div class="status" id="connection" role="status">Checking connection…</div>
    <div class="status" id="offlineReady" role="status">Preparing offline application…</div>
    <label for="meetNote">Test note — type anything here</label>
    <textarea id="meetNote" placeholder="Example: Announce senior recognition after Event 14"></textarea>
    <button id="saveButton" type="button">Save note on this computer</button>
    <p id="saved" role="status"></p>
    <p class="muted">This is a local-storage test only. No student data or Google Sheets information is connected yet.</p>
  </main>
  <script>
    'use strict';
    const connection = document.getElementById('connection');
    const offlineReady = document.getElementById('offlineReady');
    const note = document.getElementById('meetNote');
    const saved = document.getElementById('saved');
    const saveButton = document.getElementById('saveButton');
    const DB_NAME = 'swim-meet-central-v2';
    const STORE = 'local-settings';
    function updateConnection(){connection.textContent = navigator.onLine ? 'Browser reports: online' : 'Browser reports: offline';}
    window.addEventListener('online',updateConnection);
    window.addEventListener('offline',updateConnection);
    updateConnection();
    function openDatabase(){
      return new Promise((resolve,reject)=>{
        const request=indexedDB.open(DB_NAME,1);
        request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE);};
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error);
      });
    }
    async function readNote(){
      const db=await openDatabase();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(STORE,'readonly');
        const request=tx.objectStore(STORE).get('test-note');
        request.onsuccess=()=>resolve(request.result||'');
        request.onerror=()=>reject(request.error);
        tx.oncomplete=()=>db.close();
      });
    }
    async function writeNote(value){
      const db=await openDatabase();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).put(value,'test-note');
        tx.oncomplete=()=>{db.close();resolve();};
        tx.onerror=()=>{db.close();reject(tx.error);};
      });
    }
    saveButton.addEventListener('click',async()=>{
      saveButton.disabled=true;
      saved.textContent='Saving…';
      try{await writeNote(note.value);saved.textContent='Saved locally. You can close and reopen this page.';}
      catch(error){saved.textContent='Could not save locally: '+error.message;}
      finally{saveButton.disabled=false;}
    });
    readNote().then(value=>{note.value=value;if(value)saved.textContent='Your previously saved note was restored.';})
      .catch(error=>{saved.textContent='Local storage unavailable: '+error.message;});
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(async registration=>{
        await navigator.serviceWorker.ready;
        offlineReady.textContent='Offline files installed. You can test with WiFi disconnected.';
        if(registration.waiting)offlineReady.textContent='Offline files installed. A newer version is waiting for the next restart.';
      }).catch(error=>{offlineReady.textContent='Offline installation failed: '+error.message;});
    }else{offlineReady.textContent='This browser does not support offline installation.';}
  </script>
</body>
</html>
